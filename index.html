  <body class="font-['Plus_Jakarta_Sans',sans-serif] antialiased bg-brand-bg">
    <script>
      (function () {
        try {
          var migrate = { forest: 'ev', ocean: 'talent', sunset: 'industry', royal: 'intel', crimson: 'prime' };
          var t = localStorage.getItem('pc-theme');
          if (t && migrate[t]) {
            t = migrate[t];
            localStorage.setItem('pc-theme', t);
          }
          if (t) document.documentElement.setAttribute('data-theme', t);
          if (localStorage.getItem('pc-mode') === 'dark') {
            document.documentElement.setAttribute('data-mode', 'dark');
          }
        } catch (e) {}
      })();
    </script>
